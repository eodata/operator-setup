global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'eo-data-validator'
    static_configs:
      - targets: ['eo-data-validator:<EO_PROMETHEUS_PORT>']
    metric_relabel_configs:
    - target_label: operator_address
      replacement: <EO_MAIN_ADDRESS>
    - target_label: eochain
      replacement: <mainnet|testnet>
